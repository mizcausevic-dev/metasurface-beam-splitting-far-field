<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Illustrative still of a dielectric metasurface beam splitter</title>
  <desc id="heroDesc">A dark technical schematic. Cyan input reaches a row of rectangular dielectric pillars on a substrate. Partway along the row the field splits into two transmitted lobes. Dimmer rays stay in frame as leakage. A violet mark shows handedness as control. Gold ticks mark designed phase. This is not a micrograph and not a computed field.</desc>
  <rect width="1280" height="720" fill="#0B1019"/>
  <g stroke="#1C2636" stroke-width="1">
    <path d="M40 40 H1240" />
    <path d="M40 680 H1240" />
  </g>
  <text x="64" y="78" fill="#E7EEF6" font-family="Space Grotesk, ui-sans-serif, sans-serif" font-size="28" font-weight="600">Spin-tunable split, drawn as a schematic</text>
  <text x="64" y="108" fill="#93A0B5" font-family="ui-monospace, JetBrains Mono, monospace" font-size="14">Illustrative still. Not a micrograph. Not a computed field. Split drawn partway along the row for the frame.</text>

  <g transform="translate(90 250)">
    <polygon points="40,250 980,250 1040,310 100,310" fill="#141C28" stroke="#344257" stroke-width="2"/>
    <polygon points="40,250 40,270 100,330 100,310" fill="#243244" stroke="#344257"/>
    <polygon points="980,250 1040,310 1040,330 980,270" fill="#243244" stroke="#344257"/>
    <text x="48" y="292" fill="#93A0B5" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Substrate. Silica in the review summary. Thickness not specified here.</text>

    <g stroke="#00E5FF" stroke-width="3" fill="none" opacity="0.9">
      <path d="M-20 150 H150" />
      <path d="M-20 190 H150" />
      <path d="M-20 230 H150" />
    </g>
    <text x="-10" y="128" fill="#00E5FF" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Incident CP</text>

    <g fill="none" stroke="#9D4EDD" stroke-width="2.5">
      <path d="M70 70 a 28 28 0 1 1 18 8" />
      <path d="M88 78 l 8 10 l -14 2" />
    </g>
    <text x="110" y="78" fill="#9D4EDD" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Handedness. Control, not power.</text>

    <g id="pillars">
      <g fill="#344257" stroke="#51627A">
        <rect x="170" y="168" width="46" height="28" rx="3"/>
        <rect x="228" y="168" width="46" height="28" rx="3"/>
        <rect x="286" y="168" width="46" height="28" rx="3"/>
        <rect x="344" y="168" width="46" height="28" rx="3"/>
        <rect x="402" y="168" width="46" height="28" rx="3"/>
        <rect x="460" y="168" width="46" height="28" rx="3"/>
        <rect x="518" y="168" width="46" height="28" rx="3"/>
        <rect x="576" y="168" width="46" height="28" rx="3"/>
        <rect x="760" y="168" width="46" height="28" rx="3"/>
        <rect x="818" y="168" width="46" height="28" rx="3"/>
        <rect x="876" y="168" width="46" height="28" rx="3"/>
      </g>
      <g stroke="#FFD166" stroke-width="2">
        <path d="M182 182 h22"/><path d="M240 182 h22"/><path d="M298 182 h22"/>
        <path d="M356 182 h22"/><path d="M414 182 h22"/><path d="M472 182 h22"/>
        <path d="M530 182 h22"/><path d="M588 182 h22"/>
        <path d="M772 182 h22"/><path d="M830 182 h22"/><path d="M888 182 h22"/>
      </g>
    </g>
    <text x="170" y="156" fill="#FFD166" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Phase ticks. Diagram marks, not a measured profile.</text>

    <polygon points="640,182 980,70 980,130" fill="#00E5FF" opacity="0.55"/>
    <polygon points="640,182 980,230 980,290" fill="#00E5FF" opacity="0.45"/>
    <polygon points="640,182 900,175 900,195" fill="#93A0B5" opacity="0.28"/>
    <polygon points="640,182 860,40 880,55" fill="#93A0B5" opacity="0.16"/>
    <text x="860" y="58" fill="#00E5FF" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Desired pair</text>
    <text x="900" y="168" fill="#93A0B5" font-family="ui-monospace, JetBrains Mono, monospace" font-size="13">Leakage stays</text>
  </g>

  <text x="64" y="640" fill="#93A0B5" font-family="ui-monospace, JetBrains Mono, monospace" font-size="14">Colors are overlays: cyan transport, gold phase, violet control. Angles and efficiency are not drawn on this still.</text>
</svg>
